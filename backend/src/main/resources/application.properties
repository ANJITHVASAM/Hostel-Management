server.port=${PORT:8080}

# Persistent H2 file database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/hosteldb;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE}
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Enable H2 web console for debugging
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Error reporting
server.error.include-message=always

# Logging
logging.level.com.hostel=INFO
